# /etc/vita-powerd.conf
# LinuxOnVita Display Sleep, Auto-Dimming & Power Management Configuration

# Inactivity timeout in seconds before auto-dimming display (default: 180 = 3 minutes, 0 = disabled)
DIM_TIMEOUT=180

# Inactivity timeout in seconds before blanking/sleeping display (default: 300 = 5 minutes, 0 = disabled)
SLEEP_TIMEOUT=300

# Screen brightness percentage when dimmed (default: 20%)
DIM_BRIGHTNESS=20

# Power button long-press duration in seconds to trigger system shutdown (default: 3 seconds)
POWER_HOLD_SECS=3
